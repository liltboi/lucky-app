<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>今日塔罗 · 今日好运研究所</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(165deg, #fff9f5 0%, #ffeff5 45%, #f3ecff 100%);
    min-height: 100vh; max-width: 480px; margin: 0 auto;
    padding: 28px 18px 110px; color: #4a3b52;
  }
  .tag { display: inline-block; font-size: 10px; color: #b58ab0; background: rgba(255,255,255,.7); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px; }
  h1 { font-size: 28px; letter-spacing: 3px; text-align: center; color: #3d2e46; font-weight: 800; }
  .en { text-align: center; font-size: 10px; color: #b8a3c9; letter-spacing: 4px; margin-top: 6px; }
  .subtitle { text-align: center; font-size: 13px; color: #9a7d96; margin: 12px 0 6px; line-height: 1.7; }
  .sub2 { text-align: center; font-size: 12px; color: #b8a3c9; margin-bottom: 20px; }
  .card { background: rgba(255,255,255,.78); backdrop-filter: blur(12px); border-radius: 26px; padding: 22px 18px; box-shadow: 0 12px 40px rgba(220,150,190,.18); margin-bottom: 18px; }
  /* 专属牌背: 奶油白底 + 淡紫月亮 + 星星花纹 */
  .cardback {
    width: 168px; height: 272px; margin: 6px auto; border-radius: 18px; position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 50% 34%, rgba(201,167,255,.55) 0 26px, rgba(201,167,255,.18) 27px 30px, transparent 31px),
      radial-gradient(circle at 30% 20%, rgba(255,182,217,.5) 0 5px, transparent 6px),
      radial-gradient(circle at 70% 20%, rgba(255,182,217,.5) 0 4px, transparent 5px),
      radial-gradient(circle at 22% 55%, rgba(201,167,255,.45) 0 3px, transparent 4px),
      radial-gradient(circle at 78% 55%, rgba(201,167,255,.45) 0 3px, transparent 4px),
      radial-gradient(circle at 35% 75%, rgba(255,182,217,.4) 0 3px, transparent 4px),
      radial-gradient(circle at 65% 75%, rgba(255,182,217,.4) 0 3px, transparent 4px),
      repeating-linear-gradient(45deg, rgba(201,167,255,.07) 0 8px, transparent 8px 16px),
      #fffaf3;
    border: 1.5px solid #f3d9e8;
    box-shadow: 0 14px 34px rgba(201,167,255,.35);
    display: flex; align-items: center; justify-content: center;
  }
  .cardback .moon { font-size: 44px; color: #c9a7ff; filter: drop-shadow(0 4px 10px rgba(201,167,255,.5)); }
  .cardback .corner { position: absolute; font-size: 12px; color: #d9c4f0; }
  .cb-tl { top: 10px; left: 12px; } .cb-br { bottom: 10px; right: 12px; }
  /* 牌面 */
  .cardface { width: 168px; margin: 6px auto; border-radius: 18px; overflow: hidden; border: 1.5px solid #f3d9e8; box-shadow: 0 14px 34px rgba(201,167,255,.35); background: #fff; }
  .cardface img { width: 100%; display: block; }
  .cardface.rev img { transform: rotate(180deg); }
  .flipwrap { perspective: 900px; }
  .flip { transition: transform .7s ease; transform-style: preserve-3d; position: relative; }
  .flip.is-flipped { transform: rotateY(180deg); }
  .flip .side { backface-visibility: hidden; }
  .flip .front-side { transform: rotateY(180deg); }
  .go-btn {
    width: 100%; padding: 15px; margin-top: 16px; border: none; border-radius: 999px; font-size: 16px; font-weight: 700;
    letter-spacing: 2px; color: #fff; cursor: pointer;
    background: linear-gradient(120deg, #ffb6d9, #c9a7ff); box-shadow: 0 8px 22px rgba(233,150,195,.45);
  }
  .go-btn:active { transform: scale(.97); }
  .go-btn:disabled { opacity: .6; }
  .note { text-align: center; font-size: 11px; color: #b8a3c9; margin-top: 10px; }
  .shake { animation: shake .4s infinite; }
  @keyframes shake { 0%{transform:translateX(-6px) rotate(-3deg)} 50%{transform:translateX(6px) rotate(3deg)} 100%{transform:translateX(-6px) rotate(-3deg)} }
  /* 结果 */
  .r-name { text-align: center; font-size: 20px; font-weight: 800; color: #3d2e46; margin-top: 12px; }
  .r-pos { text-align: center; margin-top: 6px; }
  .r-pos span { font-size: 12px; font-weight: 700; padding: 3px 14px; border-radius: 999px; }
  .up { background: #ffe0ec; color: #d4548f; }
  .rev-tag { background: #ece0ff; color: #8d6fd0; }
  .r-key { text-align: center; font-size: 13px; color: #9a7d96; margin-top: 8px; }
  .sec { margin-bottom: 14px; }
  .sec-t { font-size: 14px; font-weight: 700; color: #d4548f; margin-bottom: 6px; }
  .sec-b { font-size: 13px; line-height: 1.9; color: #6b5570; }
  .grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .g4 { background: rgba(255,255,255,.85); border-radius: 16px; padding: 12px; border: 1px solid #f6e3ee; }
  .g4 .h { font-size: 12px; font-weight: 700; color: #8d6fd0; margin-bottom: 4px; }
  .g4 .b { font-size: 11px; line-height: 1.7; color: #6b5570; }
  .advice { background: linear-gradient(120deg, #fff0f6, #f3ecff); border-radius: 16px; padding: 14px; font-size: 13px; line-height: 1.9; color: #6b5570; text-align: center; }
  .share-btn {
    width: 100%; padding: 13px; margin-top: 16px; border: none; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: #6b5570; cursor: pointer;
    background: rgba(255,255,255,.9); box-shadow: 0 6px 18px rgba(220,150,190,.2);
  }
  .share-out { font-size: 12px; color: #7a6588; margin-top: 8px; word-break: break-all; background: #fff; border-radius: 12px; padding: 10px; }
  .footer { text-align: center; font-size: 10px; color: #c0aabe; line-height: 1.8; margin-top: 16px; }
  .footer a { color: #b195ad; }
  .hidden { display: none; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; z-index: 60;
    background: rgba(255,255,255,.95); backdrop-filter: blur(10px); display: flex;
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 20px rgba(220,150,190,.2); }
  .bn-item { flex: 1; text-align: center; font-size: 10px; color: #b195ad; text-decoration: none; padding: 4px 0; }
  .bn-item .bn-icon { font-size: 18px; display: block; margin-bottom: 1px; filter: grayscale(1) opacity(.6); }
  .bn-item.active { color: #d4548f; font-weight: 700; }
  .bn-item.active .bn-icon { filter: none; }
</style>
</head>
<body>
  <span class="tag">仅供娱乐 · 不构成任何真实预测</span>
  <h1>今日塔罗</h1>
  <div class="en">YOUR DAILY TAROT</div>
  <p class="subtitle">抽一张牌，收下今天的小小提示</p>
  <p class="sub2">静下心来，想想今天最在意的事情</p>

  <div class="card">
    <div class="flipwrap">
      <div class="flip" id="flip">
        <div class="side">
          <div class="cardback" id="back">
            <span class="corner cb-tl">✦</span>
            <span class="moon">🌙</span>
            <span class="corner cb-br">✦</span>
          </div>
        </div>
        <div class="side front-side">
          <div class="cardface" id="face"><img id="face-img" alt="塔罗牌面" loading="lazy"></div>
        </div>
      </div>
    </div>
    <button class="go-btn" id="draw-btn">🔮 抽取我的今日牌</button>
    <p class="note">每日一张 · 每日免费 · 正位与逆位 · 结果当日固定</p>
  </div>

  <div class="card hidden" id="result-card">
    <div class="r-name" id="r-name"></div>
    <div class="r-pos"><span id="r-pos"></span></div>
    <div class="r-key" id="r-key"></div>
    <div class="sec" style="margin-top:14px">
      <div class="sec-t">🪷 牌面指引</div>
      <div class="sec-b" id="r-intro"></div>
    </div>
    <div class="sec">
      <div class="sec-t">💭 四个方向的小提示</div>
      <div class="grid4">
        <div class="g4"><div class="h">💗 爱情</div><div class="b" id="r-love"></div></div>
        <div class="g4"><div class="h">📖 学业</div><div class="b" id="r-study"></div></div>
        <div class="g4"><div class="h">💼 事业</div><div class="b" id="r-career"></div></div>
        <div class="g4"><div class="h">💰 财富</div><div class="b" id="r-wealth"></div></div>
      </div>
    </div>
    <div class="advice" id="r-advice"></div>
    <button class="share-btn" id="share-btn">📲 分享今日塔罗</button>
    <div class="share-out hidden" id="share-out"></div>
  </div>

  <p class="footer">牌面：Pamela Colman Smith 1909 公版（扫描修复 Steve P.）· 牌义：<a href="https://tarovia.secondwindltd.xyz/">Tarovia</a> CC BY 4.0<br>详见 <a href="about.html">素材与版权说明</a> · 仅供娱乐</p>

  <nav class="bottom-nav">
    <a class="bn-item" href="index.html"><span class="bn-icon">🏠</span>首页</a>
    <a class="bn-item" href="fortune.html"><span class="bn-icon">🌸</span>运势</a>
    <a class="bn-item active" href="tarot.html"><span class="bn-icon">🃏</span>塔罗</a>
    <a class="bn-item" href="stars.html"><span class="bn-icon">♓</span>星座</a>
    <a class="bn-item" href="javascript:void(0)" onclick="soonNav()"><span class="bn-icon">👤</span>我的</a>
  </nav>
  <div class="toast hidden" id="toast" style="position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(61,46,70,.9);color:#fff;font-size:13px;border-radius:999px;padding:10px 20px;z-index:99">「我的」开发中 💕</div>

<script src="tarot-data.js"></script>
<script>
function seededRandom(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return function(){h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
const $ = id => document.getElementById(id);
function soonNav(){ const t=$("toast"); t.classList.remove("hidden"); setTimeout(()=>t.classList.add("hidden"),2000); }
function fmtDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

let STATE = "idle";
let DRAW = null;

function draw() {
  const ds = fmtDate(new Date());
  const rand = seededRandom("tarot-daily|" + ds);
  const i = Math.floor(rand() * TAROT.length);
  const rev = rand() > 0.62;
  return { ds, card: TAROT[i], rev };
}

function fillResult() {
  const c = DRAW.card, rev = DRAW.rev;
  const img = "tarot-img/" + c.img;
  const el = $("face-img");
  el.src = img;
  el.onerror = function(){ this.style.display = "none"; };
  el.style.display = "";
  if (rev) { el.style.transform = "rotate(180deg)"; $("face").classList.add("rev"); }
  else { el.style.transform = ""; $("face").classList.remove("rev"); }
  $("r-name").textContent = c.name;
  const pos = $("r-pos");
  pos.textContent = rev ? "逆位" : "正位";
  pos.className = rev ? "rev-tag" : "up";
  $("r-key").textContent = "今日主题：" + c.intro.split("。")[0].replace(/^"/, "");
  $("r-intro").textContent = c.intro;
  const area = (id, data) => {
    const el = $(id);
    if (!data) { el.textContent = "今天这块偏中性，按自己的节奏走就好。"; return; }
    el.innerHTML = (rev ? "<b>逆位提示：</b>" : "") + "<b>「" + data.h + "」</b><br>" + data.t;
  };
  area("r-love", c.love); area("r-study", c.study); area("r-career", c.career); area("r-wealth", c.wealth);
  $("r-advice").innerHTML = "💌 今天的温柔建议<br>" + (rev ? "逆位的能量向内——先照顾好自己的情绪，再照顾事情。" : "正位的能量向外——把想法落到一个具体的小行动上。") + c.next;
  $("result-card").classList.remove("hidden");
}

$("draw-btn").addEventListener("click", () => {
  if (STATE === "revealed") return;
  STATE = "shuffling";
  $("draw-btn").disabled = true;
  $("draw-btn").textContent = "🃏 洗牌中…";
  $("back").classList.add("shake");
  setTimeout(() => {
    $("back").classList.remove("shake");
    DRAW = draw();
    try { localStorage.setItem("tarot_" + DRAW.ds, JSON.stringify({ i: TAROT.indexOf(DRAW.card) })); } catch(e) {}
    fillResult();
    $("flip").classList.add("is-flipped");
    setTimeout(() => {
      STATE = "revealed";
      $("draw-btn").disabled = false;
      $("draw-btn").textContent = "✨ 今日已抽 · 明天再来";
    }, 750);
    $("result-card").scrollIntoView({ behavior: "smooth", block: "start" });
  }, 1300);
});

(function restore() {
  try {
    const ds = fmtDate(new Date());
    const saved = JSON.parse(localStorage.getItem("tarot_" + ds) || "null");
    if (saved && typeof saved.i === "number") {
      const rand = seededRandom("tarot-daily|" + ds);
      const i = Math.floor(rand() * TAROT.length);
      const rev = rand() > 0.62;
      DRAW = { ds, card: TAROT[i], rev };
      fillResult();
      $("flip").classList.add("is-flipped");
      STATE = "revealed";
      $("draw-btn").textContent = "✨ 今日已抽 · 明天再来";
      $("result-card").classList.remove("hidden");
    }
  } catch (e) {}
})();

$("share-btn").addEventListener("click", () => {
  const text = `我抽到了「${DRAW.card.name}」(${DRAW.rev ? "逆位" : "正位"}) ${DRAW.ds}\n今日塔罗 · 一张牌一句小提示， 正位与逆位，仅供娱乐 ✨`;
  try { navigator.clipboard.writeText(text); } catch (e) {}
  const out = $("share-out");
  out.classList.remove("hidden");
  out.textContent = "👇 分享文案（长按复制）：\n" + text;
});
</script>
</body>
</html>
