<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>星座运势 · 今日好运研究所</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ffe9f1 0%, #ffd6e8 40%, #e8d5ff 100%);
    min-height: 100vh; max-width: 480px; margin: 0 auto;
    padding: 28px 18px 60px; color: #4a3b52; position: relative;
  }
  .disclaimer-tag {
    display: inline-block; font-size: 10px; color: #b58ab0;
    background: rgba(255,255,255,.6); border-radius: 999px; padding: 3px 10px; margin-bottom: 14px;
  }
  h1 { font-size: 30px; letter-spacing: 4px; text-align: center; color: #3d2e46; font-weight: 800; text-shadow: 0 2px 0 #fff, 0 4px 14px rgba(233,142,192,.35); }
  .subtitle { text-align: center; font-size: 12px; color: #9a7d96; margin: 8px 0 24px; }
  .phone-card {
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
    border-radius: 26px; padding: 22px 18px; box-shadow: 0 12px 40px rgba(220,120,180,.2); margin-bottom: 18px;
  }
  .sign-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sign-cell {
    text-align: center; padding: 10px 2px; border-radius: 14px; cursor: pointer;
    background: rgba(255,255,255,.7); transition: transform .12s;
  }
  .sign-cell:active { transform: scale(.95); }
  .sign-cell.active { background: linear-gradient(120deg, #ff9ec7, #c9a7ff); box-shadow: 0 4px 14px rgba(233,142,192,.4); }
  .sign-cell.active .s-name, .sign-cell.active .s-icon { filter: none; }
  .sign-cell.active .s-name { color: #fff; }
  .s-icon { font-size: 20px; }
  .s-name { font-size: 11px; color: #6b5570; margin-top: 3px; }
  .date-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
  .tab { padding: 6px 13px; border-radius: 999px; font-size: 12px; background: rgba(255,255,255,.8); color: #9a7d96; cursor: pointer; border: none; }
  .tab.active { background: linear-gradient(120deg, #ff9ec7, #c9a7ff); color: #fff; font-weight: 600; }
  .day-title { font-size: 17px; font-weight: 700; color: #3d2e46; text-align: center; margin-bottom: 4px; }
  .day-sub { font-size: 12px; color: #9a7d96; text-align: center; margin-bottom: 12px; }
  .dims { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .dim .dim-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,.9); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 1s ease; }
  .c-pink  { background: linear-gradient(90deg, #ffb3d1, #ff7eb3); }
  .c-blue  { background: linear-gradient(90deg, #a8d8ff, #6cb6ff); }
  .c-orange{ background: linear-gradient(90deg, #ffd591, #ffa940); }
  .c-green { background: linear-gradient(90deg, #b7eb8f, #73d13d); }
  .lucky-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lucky-card { border-radius: 16px; padding: 12px; position: relative; }
  .lc-pink { background: #ffe0ec; } .lc-purple { background: #ece0ff; }
  .lc-orange { background: #fff0db; } .lc-green { background: #e2f7d9; }
  .lc-label { font-size: 12px; color: #7a6588; margin-bottom: 4px; }
  .lc-value { font-size: 14px; font-weight: 700; color: #4a3b52; }
  .text-block { background: rgba(255,255,255,.72); border-radius: 22px; padding: 18px; }
  .tb-title { font-size: 15px; font-weight: 700; color: #3d2e46; margin-bottom: 8px; }
  .tb-body { font-size: 13px; line-height: 1.9; color: #6b5570; }
  .back-link { display: block; text-align: center; margin-top: 16px; color: #9a7d96; font-size: 13px; text-decoration: none; }
  .hidden { display: none; }
  .footer { text-align: center; font-size: 10px; color: #b195ad; line-height: 1.8; margin-top: 26px; }
</style>
</head>

  <div class="phone-card">

  </div>

  ["aries", "白羊座", "♈", 3, 21, 4, 19], ["taurus", "金牛座", "♉", 4, 20, 5, 20],
  ["gemini", "双子座", "♊", 5, 21, 6, 21], ["cancer", "巨蟹座", "♋", 6, 22, 7, 22],
  ["leo", "狮子座", "♌", 7, 23, 8, 22], ["virgo", "处女座", "♍", 8, 23, 9, 22],

];
const ELEMENT = ["火","土","风","水","火","土","风","水","火","土","风","水"];
const MODALITY = ["开创","固定","变动","开创","固定","变动","开创","固定","变动","开创","固定","变动"];

function seededRandom(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

let CUR_SIGN = -1;

function buildSignGrid() {
  const g = document.getElementById("sign-grid");
  SIGNS.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "sign-cell";
    d.innerHTML = `<div class="s-icon"><svg viewBox="0 0 512 512" width="22" height="22">${SIGN_SVG[s[0]]}</svg></div><div class="s-name">${s[1].slice(0, 2)}</div>`;
    d.addEventListener("click", () => { CUR_SIGN = i; renderTabs(); });
    g.appendChild(d);
  });
}

function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

function renderTabs() {
  const tabs = document.getElementById("date-tabs");
  tabs.innerHTML = "";
  const mk = (off, label) => {
    const d = new Date(); d.setDate(d.getDate() + off);
    const b = document.createElement("button");
    b.className = "tab" + (off === 0 ? " active" : "");
    b.textContent = label;
    b.addEventListener("click", () => { CUR_DATE = off; renderTabs(); });
    tabs.appendChild(b);
  };
  mk(-1, "昨日"); mk(0, "今日"); mk(1, "明日");
  render();
}

let CUR_DATE = 0;

function computeFor(signIdx, dateStr) {
  const s = SIGNS[signIdx];
  const rand = seededRandom(s[0] + "|" + dateStr);
  const base = 45 + Math.floor(rand() * 35); // 45-79
  const dims = {
    love:   Math.max(30, Math.min(95, base + Math.round(rand() * 24 - 12))),
    wealth: Math.max(30, Math.min(95, base + Math.round(rand() * 24 - 12))),
    career: Math.max(30, Math.min(95, base + Math.round(rand() * 24 - 12))),
    study:  Math.max(30, Math.min(95, base + Math.round(rand() * 24 - 12)))
  };
  const colors = ["樱花粉","雾霾蓝","奶油白","薄荷绿","香芋紫","柠檬黄","珊瑚橙","雾灰"];
  const times = ["清晨 7-9 点","上午 10-12 点","午后 2-4 点","傍晚 5-7 点","晚间 8-10 点"];
  const mateIdx = (signIdx + 4 + Math.floor(rand() * 4)) % 12;
  return { dims, color: colors[Math.floor(rand() * colors.length)],
    num: 1 + Math.floor(rand() * 30), time: times[Math.floor(rand() * times.length)],
    mate: SIGNS[mateIdx][1].slice(0, 2), element: ELEMENT[signIdx], modality: MODALITY[signIdx] };
}

function render() {
  const grid = document.getElementById("sign-grid");
  [...grid.children].forEach((c, i) => c.classList.toggle("active", i === CUR_SIGN));
  if (CUR_SIGN < 0) {
    document.getElementById("result").style.display = "none";
    document.getElementById("day-title").textContent = "";
    document.getElementById("day-sub").textContent = "";
    return;
  }
  document.getElementById("result").style.display = "";
  const d = new Date(); d.setDate(d.getDate() + CUR_DATE);
  const ds = fmtDate(d);
  const r = computeFor(CUR_SIGN, ds);
  const s = SIGNS[CUR_SIGN];
  document.getElementById("day-title").innerHTML =
    `<svg viewBox="0 0 512 512" width="20" height="20" style="vertical-align:-3px;color:#d4548f">${SIGN_SVG[s[0]]}</svg> ${s[1]} · ${CUR_DATE === 0 ? "今日" : CUR_DATE === 1 ? "明日" : "昨日"}运势`;
  const synodic = 29.53058867;
const ref = new Date(Date.UTC(2000, 0, 6)); // 新月锚点(0点近似, 满月校验 2000-01-21 ✓)
const phaseIdx = Math.floor((((d - ref) / 86400000) % synodic + synodic) % synodic / (synodic / 8)) % 8;
const moonNames = ["新月","娥眉月","上弦月","盈凸月","满月","亏凸月","下弦月","残月"];
document.getElementById("day-sub").innerHTML =
  `<svg viewBox="0 0 512 512" width="14" height="14" style="vertical-align:-2px;color:#c9a7ff">${MOON_SVG[phaseIdx]}</svg> 今日月相「${moonNames[phaseIdx]}」 · ${ds} · ${r.element}象${r.modality}星座`;
  const vm = [["p-love","b-love",r.dims.love],["p-wealth","b-wealth",r.dims.wealth],["p-career","b-career",r.dims.career],["p-study","b-study",r.dims.study]];
  for (const [p, b, v] of vm) { document.getElementById(p).textContent = v + "%"; document.getElementById(b).style.width = v + "%"; }

  document.getElementById("l-time").textContent = r.time;
  document.getElementById("l-mate").textContent = r.mate + "座";

  document.getElementById("summary").textContent =
    `${s[1]}今天${avg >= 70 ? "整体能量偏高，属于顺风局，重要的对话和行动放在「" + r.time + "」，成功率更高" : avg >= 55 ? "整体平稳，按自己的节奏走就好，遇到犹豫的事多等半天再决定" : "整体能量偏内收，适合整理和复盘，不适合开新局"}。` +
    `速配星座是${r.mate}座——${CUR_DATE === 1 ? "明天" : "今天"}有事多听听他们的意见。幸运数字 ${r.num} 可以用在选号、尾号这类小决定上。`;
}

buildSignGrid();
renderTabs();
</script>
</body>
