<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>今日好运指数 · 娱乐测试</title>
<style>
  :root {
    --bg: #0f0d1a;
    --card: #1c1930;
    --gold: #f5c451;
    --purple: #8b7cf6;
    --text: #f0eee8;
    --muted: #9a94b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #2a1f4d 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 24px 16px 48px;
    max-width: 480px;
    margin: 0 auto;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid #3a3358;
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 26px;
    background: linear-gradient(120deg, var(--gold), #fff3d6, var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  .card {
    background: var(--card);
    border: 1px solid #2e2950;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #3a3358;
    background: #141223;
    color: var(--text);
    font-size: 15px;
  }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    background: linear-gradient(120deg, var(--gold), #e0a63c);
    color: #1a130a;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  .hidden { display: none; }
  .score-ring {
    width: 160px; height: 160px;
    margin: 10px auto 6px;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: conic-gradient(var(--gold) calc(var(--s) * 1%), #2e2950 0);
    position: relative;
  }
  .score-ring::before {
    content: "";
    position: absolute;
    width: 128px; height: 128px;
    border-radius: 50%;
    background: var(--card);
  }
  .score-num, .score-label { position: relative; z-index: 1; text-align: center; }
  .score-num { font-size: 42px; font-weight: 700; color: var(--gold); }
  .score-label { font-size: 12px; color: var(--muted); }
  .verdict {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    margin: 8px 0 16px;
  }
  .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #2e2950; font-size: 14px; }
  .item:last-child { border-bottom: none; }
  .stars { color: var(--gold); letter-spacing: 2px; }
  .desc { font-size: 14px; line-height: 1.8; color: #d5d0e8; margin-top: 12px; }
  .tip-title { font-size: 15px; font-weight: 600; color: var(--gold); margin: 14px 0 6px; }
  .upsell {
    background: linear-gradient(120deg, #2a1f4d, #1c1930);
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 20px;
    margin-top: 8px;
    text-align: center;
  }
  .upsell h3 { color: var(--gold); font-size: 17px; margin-bottom: 8px; }
  .upsell p { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
  .upsell button { margin-top: 0; }
  .footer {
    margin-top: 28px;
    font-size: 11px;
    color: #6b6590;
    text-align: center;
    line-height: 1.8;
  }
  .share-btn {
    background: #2e2950;
    color: var(--text);
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="input-view">
  <span class="badge">仅供娱乐 · 不构成任何真实预测</span>
  <h1>今日好运指数</h1>
  <p class="sub">输入你的生日，看看今天的星象能量站在你这边吗？<br>同一生日每天结果固定，测完可以和朋友对比～</p>

  <div class="card">
    <label>你的生日</label>
    <input type="date" id="birth" max="2026-12-31" min="1940-01-01">
    <label>性别（影响解读口吻，可选）</label>
    <select id="gender">
      <option value="x">保密</option>
      <option value="f">女生</option>
      <option value="m">男生</option>
    </select>
    <button id="go-btn">✨ 测今日好运</button>
    <div id="msg" style="color:#f08a8a;font-size:13px;margin-top:10px;min-height:18px;"></div>
  </div>
  <p class="footer">本测试基于传统历法的娱乐化演绎，结果随机生成、仅供消遣。<br>请勿将结果作为任何现实决策依据。</p>
</div>

<div id="result-view" class="hidden">
  <span class="badge" id="date-tag"></span>
  <h1>你的今日运势</h1>
  <div class="card" style="text-align:center">
    <div class="score-ring" id="ring">
      <div class="score-num" id="score">0</div>
      <div class="score-label">今日好运指数</div>
    </div>
    <div class="verdict" id="verdict"></div>
    <div class="desc" id="summary"></div>
  </div>

  <div class="card">
    <div class="item"><span>💰 财运</span><span class="stars" id="s-wealth"></span></div>
    <div class="item"><span>🍀 贵人运</span><span class="stars" id="s-noble"></span></div>
    <div class="item"><span>❤️ 桃花运</span><span class="stars" id="s-love"></span></div>
    <div class="item"><span>⚡ 行动力</span><span class="stars" id="s-action"></span></div>
  </div>

  <div class="card">
    <div class="tip-title">🔮 今日宜</div>
    <div class="desc" id="do-list"></div>
    <div class="tip-title">⚠️ 今日注意</div>
    <div class="desc" id="dont-list"></div>
    <div class="tip-title">🎨 幸运色 & 数字</div>
    <div class="desc" id="lucky"></div>
  </div>

  <button class="share-btn" onclick="share()">📲 复制结果分享给朋友</button>
  <div id="share-tip" style="color:var(--gold);font-size:13px;margin-top:10px;"></div>
  <div id="share-text" style="color:var(--muted);font-size:13px;margin-top:6px;line-height:1.7;word-break:break-all;"></div>

  <div class="upsell">
    <h3>想看更深度的吗？</h3>
    <p>你的生日里还藏着一套完整的<br><b style="color:var(--gold)">「天生搞钱方式」分析</b><br>——你适合稳扎稳打还是风口起飞？</p>
    <button id="upsell-btn">🔓 解锁完整报告 ¥1.9</button>
  </div>

  <button class="share-btn" onclick="back()">↩️ 测别的日期</button>
  <p class="footer">本测试基于传统历法的娱乐化演绎，结果随机生成、仅供消遣。<br>请勿将结果作为任何现实决策依据。</p>
</div>

<script>
// ---- 确定性伪随机: 同一生日+同一日期 => 同一结果 ----
function seededRandom(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

const VERDICTS = [
  [85, "🌟 大吉 · 星象超燃"], [85, "🌟 大吉 · 星象超燃"],
  [70, "☀️ 小吉 · 顺水行舟"], [70, "☀️ 小吉 · 顺水行舟"], [70, "☀️ 小吉 · 顺水行舟"],
  [58, "🌤 平稳 · 稳字当头"], [58, "🌤 平稳 · 稳字当头"], [58, "🌤 平稳 · 稳字当头"], [58, "🌤 平稳 · 稳字当头"],
  [45, "🌥 微凉 · 少动多看"]
];

const DO_POOL = ["主动联系一位重要的人", "把拖了很久的小事清掉", "当众表达你的想法", "整理你的桌面和待办", "尝试一件 15 分钟内的新鲜事", "给身边的人一个小惊喜", "复盘最近的支出", "早睡一小时", "出门散步晒晒太阳", "写下一件本周想完成的事"];
const DONT_POOL = ["冲动消费超过预算", "和杠精争辩到深夜", "把重要决定拖到最后一刻", "深夜做重大决定", "答应自己做不到的事", "熬夜刷手机到两点", "借钱给不太熟的人", "在饥饿时逛购物软件"];
const COLORS = [
  ["金色 / 奶油白", 3, 7], ["雾紫色 / 深蓝", 2, 9], ["暖橙色 / 米色", 1, 6],
  ["墨绿色 / 银灰", 5, 8], ["樱桃红 / 象牙白", 4, 2]
];
const SUM_P = {
  85: ["今天星象能量整体偏高，适合推进重要的事——你近期的某个念头值得在今天动手迈出第一步。"]
  , 70: ["今天整体顺遂，没有明显的坑，适合按计划推进日常事项，遇到小机会可以顺手抓住。"],
  58: ["今天能量平稳，不出彩也不踩坑，适合处理积累的事务，把节奏稳住就是赢。"],
  45: ["今天星象偏静，重要的事建议缓一缓，多观察少出手，把时间留给思考和休息。"]
};
const GENDER_TONE = { f: "姐妹", m: "兄弟", x: "朋友" };

function stars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }

function showMsg(t) { const m = document.getElementById("msg"); if (m) m.textContent = t; }

function run() {
  let birth = document.getElementById("birth").value;
  if (!birth) {
    birth = "1998-06-15"; // 无输入时用默认生日, 保证按钮始终有反应
    showMsg("未选生日，已用示例生日 1998-06-15 演示");
  }
  const gender = document.getElementById("gender").value;
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
  const rand = seededRandom(birth + "|" + dateStr);

  // 挑一个 verdict 档位 (加权后仍由种子决定, 确定性)
  const pick = VERDICTS[Math.floor(rand() * VERDICTS.length)];
  const base = pick[0];
  const score = base + Math.floor(rand() * 10) - 5; // 档位内浮动
  const tone = GENDER_TONE[gender];

  document.getElementById("date-tag").textContent = dateStr + " · 仅供娱乐";
  document.getElementById("score").textContent = score;
  document.getElementById("ring").style.setProperty("--s", score);
  document.getElementById("verdict").textContent = pick[1];

  const sumPool = SUM_P[base] || SUM_P[58];
  document.getElementById("summary").textContent =
    `${tone}，` + sumPool[0] + (score >= 75 ? " 今天请大胆一点。" : score >= 55 ? " 保持你的节奏就好。" : " 保存实力，明天再战。");

  // 四维 (基于同一种子, 与总分相关但各有波动)
  const dim = (b) => Math.max(1, Math.min(5, Math.round((score / 100) * 5 + (rand() * 1.6 - 0.8)) + (b ? 0 : 0)));
  document.getElementById("s-wealth").textContent = stars(dim());
  document.getElementById("s-noble").textContent = stars(dim());
  document.getElementById("s-love").textContent = stars(dim());
  document.getElementById("s-action").textContent = stars(dim());

  // 宜 / 忌: 各取2条
  const pickN = (arr, n) => { const a = [...arr]; const out = []; for (let i = 0; i < n; i++) out.push(a.splice(Math.floor(rand() * a.length), 1)[0]); return out; };
  document.getElementById("do-list").innerHTML = "✅ " + pickN(DO_POOL, 2).join("<br>✅ ");
  document.getElementById("dont-list").innerHTML = "🚫 " + pickN(DONT_POOL, 2).join("<br>🚫 ");

  const lucky = COLORS[Math.floor(rand() * COLORS.length)];
  document.getElementById("lucky").textContent = `幸运色：${lucky[0]} ｜ 幸运数字：${lucky[1]}、${lucky[2]}`;

  document.getElementById("input-view").classList.add("hidden");
  document.getElementById("result-view").classList.remove("hidden");
  window.scrollTo(0, 0);

  // 存最近一次记录, 方便"分享"文案
  window.__lastResult = { date: dateStr, score, verdict: pick[1] };
}

function share() {
  const r = window.__lastResult;
  const text = `我在「今日好运指数」测了 ${r.date} 的运势：${r.score} 分 ${r.verdict}\n快来测测你的：`;
  try { navigator.clipboard.writeText(text); showShareTip(text); }
  catch (e) { showShareTip(text); }
}

function showShareTip(text) {
  const el = document.getElementById("share-tip");
  if (el) { el.textContent = "👇 分享文案已生成，长按复制：" ; document.getElementById("share-text").textContent = text; }
  else { window.prompt("复制以下文案分享：", text); }
}

function back() {
  document.getElementById("result-view").classList.add("hidden");
  document.getElementById("input-view").classList.remove("hidden");
  window.scrollTo(0, 0);
}

// 事件绑定 (不依赖内联 onclick)
document.getElementById("go-btn").addEventListener("click", run);
document.getElementById("upsell-btn").addEventListener("click", function () {
  const el = document.getElementById("share-tip");
  el.textContent = "💡 付费模块开发中——上线后此处将跳转店铺商品页";
});
document.getElementById("birth").addEventListener("change", function(){ showMsg(""); });
</script>
</body>
</html>
