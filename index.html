<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>今日好运研究所</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ffe9f1 0%, #ffd6e8 40%, #e8d5ff 100%);
    min-height: 100vh; max-width: 480px; margin: 0 auto;
    padding: 30px 20px 60px; color: #4a3b52; position: relative;
  }
  .card {
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
    border-radius: 26px; padding: 22px 20px;
    box-shadow: 0 12px 40px rgba(220,120,180,.2);
    margin-bottom: 16px;
  }
  .head { text-align: center; margin-bottom: 26px; }
  .head h1 { font-size: 30px; letter-spacing: 3px; color: #3d2e46; font-weight: 800; text-shadow: 0 2px 0 #fff, 0 4px 14px rgba(233,142,192,.35); }
  .head .en { font-size: 11px; color: #9a7d96; letter-spacing: 3px; margin-top: 8px; }
  .badge {
    display: inline-block; margin-top: 12px; font-size: 12px; color: #c96aa0;
    background: linear-gradient(120deg, #ffe0ec, #ece0ff); border-radius: 999px; padding: 5px 16px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .tile {
    border-radius: 20px; padding: 18px 16px; cursor: pointer; position: relative;
    transition: transform .15s; min-height: 120px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .tile:active { transform: scale(.97); }
  .t-pink { background: #ffe0ec; } .t-purple { background: #ece0ff; }
  .t-orange { background: #fff0db; } .t-green { background: #e2f7d9; }
  .tile .icon { font-size: 24px; }
  .tile .name { font-size: 16px; font-weight: 700; color: #3d2e46; margin-top: 10px; }
  .tile .desc { font-size: 11px; color: #8a6b88; margin-top: 4px; line-height: 1.6; }
  .tile .soon {
    position: absolute; top: 10px; right: 10px; font-size: 9px; color: #fff;
    background: rgba(180,140,180,.55); border-radius: 999px; padding: 2px 8px;
  }
  .wide {
    background: linear-gradient(120deg, #ff9ec7, #c9a7ff); border-radius: 20px;
    padding: 18px 16px; margin-bottom: 16px; cursor: pointer;
    box-shadow: 0 10px 28px rgba(233,142,192,.4);
  }
  .wide:active { transform: scale(.98); }
  .wide .icon { font-size: 22px; }
  .wide .name { color: #fff; font-size: 16px; font-weight: 800; margin-top: 8px; }
  .wide .desc { color: rgba(255,255,255,.92); font-size: 11px; margin-top: 4px; line-height: 1.6; }
  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    background: rgba(61,46,70,.9); color: #fff; font-size: 13px;
    border-radius: 999px; padding: 10px 20px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 9;
  }
  .toast.show { opacity: 1; }
  .footer { text-align: center; font-size: 10px; color: #b195ad; line-height: 1.8; margin-top: 8px; }
</style>
</head>
<body>
  <div class="head">
    <h1>✨ 今日好运研究所 ✨</h1>
    <div class="en">DAILY LUCK · MAKE EVERY DAY MAGICAL</div>
    <div class="badge">💕 笑着看看运势，每天一个好心情</div>
  </div>

  <div class="grid">
    <div class="tile t-pink" onclick="go('fortune.html')">
      <div class="icon">🌸</div>
      <div><div class="name">每日运势</div><div class="desc">今日财运、桃花、贵人、行动力</div></div>
    </div>
    <div class="tile t-purple" onclick="soon('每日塔罗')">
      <div class="icon">🃏</div>
      <div><div class="name">每日塔罗</div><div class="desc">抽一张牌，看看今日提示</div></div>
      <div class="soon">开发中</div>
    </div>
    <div class="tile t-orange" onclick="soon('星座运势')">
      <div class="icon">♓</div>
      <div><div class="name">星座运势</div><div class="desc">爱情、学业、事业、财富</div></div>
      <div class="soon">开发中</div>
    </div>
    <div class="tile t-green" onclick="soon('幸运穿搭')">
      <div class="icon">🎀</div>
      <div><div class="name">幸运穿搭</div><div class="desc">幸运色、穿搭、幸运物</div></div>
      <div class="soon">开发中</div>
    </div>
  </div>

  <div class="wide" onclick="soon('专属好运报告')">
    <div class="icon">💌</div>
    <div class="name">专属好运报告</div>
    <div class="desc">根据出生资料生成个性化内容，支持分享精美图片</div>
  </div>

  <p class="footer">所有内容仅供娱乐，不构成任何真实预测<br>请勿作为现实决策依据 · 本站不保存任何个人信息</p>

  <div class="toast" id="toast"></div>
  <script>
    function go(url) { location.href = url; }
    let timer = null;
    function soon(name) {
      const t = document.getElementById("toast");
      t.textContent = "「" + name + "」模块开发中，敬请期待 💕";
      t.classList.add("show");
      clearTimeout(timer);
      timer = setTimeout(() => t.classList.remove("show"), 2200);
    }
  </script>
</body>
</html>
